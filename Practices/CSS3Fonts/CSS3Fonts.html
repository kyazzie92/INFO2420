<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts - Practice 4B</title>
<style>
@font-face {
  font-family: 'Darkh4';
  src: url('fonts/Darkh4.eot');                 /* IE */
  src: local('Darkh4'),                         /* try local first */
       url('fonts/Darkh4.ttf') format('truetype'); /* modern browsers */
}

body {
  font-family: 'Darkh4', Arial, sans-serif;
}
</style>
</head>
<body>
<p>
  What is your favorite Western movie? This font is called Darkh4. 
  Does it make you think of the wild, wild West?
</p>
</body>
</html>
