<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts - Practice 4B</title>
<style>
@font-face { ... Darkh4 ... }
@font-face { ... BleedingCowboys ... }
@font-face { ... bendable ... }

<p style="font-family: 'Darkh4', Arial, sans-serif;">Text using Darkh4...</p>
<p style="font-family: 'BleedingCowboys', Arial, sans-serif;">Text using BleedingCowboys...</p>
<p style="font-family: 'bendable', Arial, sans-serif;">Text using bendable...</p>
}
</style>
</head>
<body>
<p>
  What is your favorite Western movie? This font is called Darkh4. 
  Does it make you think of the wild, wild West?
</p>
</body>
</html>
